name: Boom Supersonic
description: 'Boom Supersonic is a Denver-based aerospace company building supersonic
  commercial aircraft to make the world dramatically more accessible. Its flagship
  airliner, Overture, is designed to carry passengers at twice the speed of today''s
  jets and has orders and pre-orders from United Airlines, American Airlines, and
  Japan Airlines. The company develops the Symphony medium-bypass turbofan engine
  purpose-built for supersonic flight, flew the XB-1 demonstrator past Mach 1, and
  is applying its propulsion technology to Superpower gas turbines for data-center
  energy. Boom is a deep-tech, hardware-first manufacturer and does not currently
  publish a public developer API surface; this profile tracks its identity and
  security posture in the API Evangelist network. Backed by Bessemer Venture Partners,
  Electric Capital, and Homebrew.'
